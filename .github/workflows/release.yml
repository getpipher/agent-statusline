name: Release

# Publishes @getpipher/agent-statusline (packages/omp-renderer) to npm on tag push (v*).
# Uses the getpipher org secret NPM_TOKEN (granular npm token, Read-and-write,
# scoped to @getpipher, with "Bypass 2FA" — no OTP needed). Inherited by all
# getpipher repos.  gh secret set NPM_TOKEN --org getpipher
#
# Idempotent: skips if the version is already on npm (safe to re-run, even
# while npm is still staging the earlier publish — issue #6).
# No build step — extensions ship raw .ts, loaded by omp/pi directly.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub Releases on tag push

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm -C packages/omp-renderer typecheck

      - name: Tests
        run: pnpm -C packages/omp-renderer test:run

      - name: Skip if already published
        id: check
        working-directory: packages/omp-renderer
        run: |
          set -u
          ver=$(node -p "require('./package.json').version")
          pkg=$(node -p "require('./package.json').name")
          existing=$(npm view "$pkg@$ver" version 2>/dev/null || true)
          if [ "$existing" = "$ver" ]; then
            echo "::notice::$pkg@$ver already on npm — skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Publishing $pkg@$ver"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        working-directory: packages/omp-renderer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # npm staging lag (issue #6): a version accepted seconds ago is invisible to the
        # `npm view` skip check above until npm serves it, so a re-run re-publishes and
        # dies with E409 "Cannot publish over previously staged version". That is the
        # skip case in disguise — notice and exit 0; every other failure still fails.
        run: |
          set -u
          if ! out=$(npm publish --access public 2>&1); then
            if printf '%s' "$out" | grep -q "Cannot publish over previously staged version"; then
              echo "::notice::version staged on npm (earlier publish still processing) — skipping"
              exit 0
            fi
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out"

      # Keep GitHub Releases in sync with npm: create a release for the tag
      # (auto-generated notes). Idempotent — skips if the release already exists.
      # Tag-guarded: on workflow_dispatch, GITHUB_REF_NAME is a branch, and
      # creating a "release" for it would mint a bogus git tag.
      - name: Create GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists — skipping"
          else
            gh release create "$tag" --generate-notes --title "$tag"
          fi
